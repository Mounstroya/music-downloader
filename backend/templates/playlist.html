<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar playlist</title>
    <base href="{{ request.scope.get('root_path', '') }}/">
    <link rel="stylesheet" href="static/playlist.css?v=1">
</head>
<body>
<div class="wrap">
    <header class="top">
        <a href="./" class="back">← Buscador</a>
        <h1>Revisar playlist</h1>
        <a href="cookies" class="back">🍪 Cookies de YouTube</a>
        <div id="spAccount" class="account"></div>
    </header>

    <section class="card" id="importCard">
        <form id="importForm" class="row">
            <input id="plUrl" type="text" placeholder="Pega el link de una playlist de Spotify o Deezer" autocomplete="off">
            <button class="btn primary" type="submit" id="importBtn">Cargar</button>
        </form>
        <div id="savedPlaylists" class="saved"></div>
        <div id="connectBox" class="notice hidden"></div>
    </section>

    <section id="plView" class="hidden">
        <div class="card summary">
            <div class="pl-head">
                <div>
                    <h2 id="plName"></h2>
                    <div id="plMeta" class="muted"></div>
                </div>
                <div class="pl-actions">
                    <button class="btn" id="reloadBtn" title="Volver a leer la playlist de Spotify">↻ Actualizar playlist</button>
                    <button class="btn" id="rescanBtn" title="Volver a revisar la carpeta de música">Reescanear biblioteca</button>
                    <button class="btn primary" id="bulkBtn">Descargar todas las que faltan</button>
                </div>
            </div>
            <div id="bulkBar" class="bulk hidden"></div>
            <div class="progress"><div id="progFill"></div></div>
            <div class="filters" id="filters"></div>
            <input id="filterText" type="search" placeholder="Filtrar por canción o artista…">
        </div>
        <div id="list" class="list"></div>
    </section>
</div>
<div id="toast" class="toast hidden"></div>
<script src="static/playlist.js?v=1"></script>
</body>
</html>
