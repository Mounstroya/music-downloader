<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisar playlist</title>
    <base href="{{ request.scope.get('root_path', '') }}/">
    <link rel="stylesheet" href="static/playlist.css?v=2">
</head>
<body>
<div class="wrap">
    <header class="top">
        <a href="./" class="back">← Buscador</a>
        <h1>Revisar playlist</h1>
        <a href="cookies" class="back">🍪 Cookies de YouTube</a>
        <div id="spAccount" class="account"></div>
    </header>

    <section class="card" id="importCard">
        <form id="importForm" class="row">
            <input id="plUrl" type="text" placeholder="Link de playlist: Spotify, Deezer, YouTube Music/YouTube o Apple Music" autocomplete="off">
            <button class="btn primary" type="submit" id="importBtn">Cargar</button>
            <button class="btn" type="button" id="textToggle">Pegar lista o subir CSV</button>
        </form>
        <div id="textBox" class="textbox hidden">
            <div class="muted">Una canción por línea: <code>Artista - Canción</code> (también sirve <code>Canción - Artista</code>, tabuladores o comas).
                O sube un CSV con encabezados (p. ej. exportado con Exportify: <i>Track Name</i>, <i>Artist Name(s)</i>, <i>ISRC</i>…).</div>
            <input id="txtName" type="text" placeholder="Nombre de la lista (opcional)" maxlength="120" autocomplete="off">
            <textarea id="txtList" rows="8" placeholder="Queen - Bohemian Rhapsody&#10;Soda Stereo - De Música Ligera&#10;Blinding Lights - The Weeknd"></textarea>
            <div class="row wrap-row">
                <label class="btn file">Elegir archivo CSV/TXT<input id="txtFile" type="file" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden></label>
                <span id="txtFileName" class="muted"></span>
                <span style="flex:1"></span>
                <button class="btn primary" type="button" id="txtImport">Importar lista</button>
            </div>
        </div>
        <div id="importStatus" class="muted import-status hidden"></div>
        <div id="savedPlaylists" class="saved"></div>
        <div id="connectBox" class="notice hidden"></div>
    </section>

    <section id="plView" class="hidden">
        <div class="card summary">
            <div class="pl-head">
                <div>
                    <h2 id="plName"></h2>
                    <div id="plMeta" class="muted"></div>
                </div>
                <div class="pl-actions">
                    <button class="btn" id="reloadBtn" title="Volver a leer la playlist y marcar las canciones nuevas">↻ Sincronizar ahora</button>
                    <button class="btn" id="syncCfgBtn" title="Sincronización automática de esta playlist">⚙ Automática</button>
                    <button class="btn" id="rescanBtn" title="Volver a revisar la carpeta de música">Reescanear biblioteca</button>
                    <button class="btn primary" id="bulkBtn">Descargar todas las que faltan</button>
                </div>
            </div>
            <div id="syncBar" class="syncbar"></div>
            <div id="syncCfg" class="syncfg hidden"></div>
            <div id="bulkBar" class="bulk hidden"></div>
            <div class="progress"><div id="progFill"></div></div>
            <div class="filters" id="filters"></div>
            <input id="filterText" type="search" placeholder="Filtrar por canción o artista…">
        </div>
        <div id="list" class="list"></div>
    </section>
</div>
<div id="toast" class="toast hidden"></div>
<script src="static/playlist.js?v=2"></script>
</body>
</html>
